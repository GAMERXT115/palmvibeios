name: Build iOS Runner
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare iOS Environment
        run: |
          flutter pub get
          flutter precache --ios
          # This command generates podhelper.rb without a full build
          flutter build ios --config-only --no-codesign

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r PalmVibe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PalmVibe-IPA
          path: PalmVibe.ipa
